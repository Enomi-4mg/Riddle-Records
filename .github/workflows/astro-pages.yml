name: Deploy Astro site to GitHub Pages
run-name: Deploy site (${{ github.event.client_payload.deployment_id || inputs.deployment_id || 'manual' }})

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [cms_site_deploy]
  workflow_dispatch:
    inputs:
      deployment_id:
        description: CMS deployment identifier
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Set site update date
        env:
          DEPLOY_SHA: HEAD
        run: |
          git show -s --format='PUBLIC_SITE_UPDATED_AT=%cI' "$DEPLOY_SHA" >> "$GITHUB_ENV"

      - name: Build Astro site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
