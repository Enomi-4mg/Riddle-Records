name: Deploy Content Editor Worker

on:
  push:
    branches: ["main"]
    paths:
      - "journal-editor-app/**"
      - "src/utils/images.ts"
      - "shared/**"
      - "assets/css/embeds.css"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/content-editor-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-editor-worker
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: journal-editor-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            journal-editor-app/package-lock.json

      - name: Install root dependencies
        working-directory: .
        run: npm ci

      - name: Install editor dependencies
        run: npm ci

      - name: Check Worker types
        run: npm run check:worker

      - name: Test editor
        run: npm test

      - name: Build editor
        run: npm run build

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
